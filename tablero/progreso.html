<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>(function(){try{var u=new URL(location.href);var k=u.searchParams.get("k");if(k){localStorage.setItem("organizador_token",k);u.searchParams.delete("k");history.replaceState({},"",u.pathname+u.search+u.hash);}}catch(e){}})();</script>
<title>LoveSprint — Progreso</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<script src="/tablero/dd.js" defer></script>
<style>
  :root{
    --paper:#FBFAF6;--paper-deep:#F5F2EA;--surface:#FFFFFF;--surface-2:#F8F6F0;
    --ink:#0E0D0B;--charcoal:#3A3733;--stone:#7A746B;--mist:#A8A29A;
    --line:#E8E4DA;--line-soft:#F0ECE2;--line-strong:#D5CFC2;
    --burnt:#EC4899;--burnt-hover:#DB2777;--burnt-soft:#FCE7F3;--burnt-line:#F9A8D4;
    --sage:#5C8A6F;--sage-soft:#E8F0EA;--sage-deep:#4A7259;--crimson:#A8392F;--crimson-soft:#F4E5E3;
    --amber:#C88A1E;--amber-soft:#FaF0DB;--amber-glow:#F5B841;--indigo:#8B5CF6;--indigo-soft:#F3E8FF;
    --font-brand:"Fraunces","Times New Roman",serif;--font-body:"Inter",-apple-system,sans-serif;
    --num:"Inter",-apple-system,sans-serif;
    --ease:cubic-bezier(.4,0,.2,1);
    --shadow:0 1px 2px rgba(14,13,11,.04),0 8px 24px -14px rgba(14,13,11,.12);
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--ink);background:var(--paper);
    background-image:radial-gradient(circle at 12% 8%,rgba(236,72,153,.04)0%,transparent 42%),radial-gradient(circle at 88% 92%,rgba(92,138,111,.05)0%,transparent 48%);}
  .app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;}
  .sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-gutter:stable;padding:24px 18px;border-right:1px solid #241A38;
    background:linear-gradient(180deg,#3B2D52 0%,#241A38 100%);display:flex;flex-direction:column;gap:22px;color:#E2E8F0;
    --sb-muted:#94A3B8;--sb-text:#E2E8F0;--sb-hover:rgba(255,255,255,.08);}
  .brand-mark{font-family:var(--font-brand);font-style:italic;font-size:28px;line-height:1;letter-spacing:-.02em;color:#fff;}
  .brand-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);font-weight:500;}
  .nav-section{display:flex;flex-direction:column;gap:2px;}
  .nav-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);padding:0 10px 6px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--sb-text);font-size:13.5px;
    text-decoration:none;transition:background .15s;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left;width:100%;font-weight:500;position:relative;}
  .nav-item:hover{background:var(--sb-hover);color:#fff;}
  .nav-item.active{background:#fff;color:#241A38;font-weight:600;}
  .nav-item.active::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:#F472B6;border-radius:0 2px 2px 0;}
  .nav-icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  main{padding:36px 44px 90px;min-width:0;max-width:900px;width:100%;}

  /* Números de datos: SANS, no serif */
  .num{font-family:var(--num);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}

  .greeting{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--burnt);font-weight:700;}
  h1{font-family:var(--font-brand);font-weight:500;font-size:42px;line-height:1.04;letter-spacing:-.025em;margin:5px 0 4px;}
  h1 em{font-style:italic;color:var(--burnt);}
  .hero-sub{color:var(--stone);font-size:14px;margin:0;}
  .hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px;}
  .streak-badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#F5B841,#E8850C);
    color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;
    box-shadow:0 6px 18px -4px rgba(232,133,12,.5);}
  .streak-badge .fire{font-size:15px;filter:drop-shadow(0 0 4px rgba(255,220,120,.8));}

  .tabs{display:inline-flex;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:20px;box-shadow:var(--shadow);}
  .tab{border:none;background:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:var(--stone);
    padding:8px 20px;border-radius:999px;transition:all .15s;}
  .tab.active{background:var(--sage);color:#fff;box-shadow:0 2px 8px -2px rgba(92,138,111,.5);}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow);}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px;}
  .card-t{font-size:13px;color:var(--stone);font-weight:600;}
  .card-big{font-size:36px;line-height:1;color:var(--ink);margin-top:6px;}
  .card-big .u{font-size:15px;color:var(--stone);font-weight:500;font-family:var(--font-body);letter-spacing:0;margin-left:2px;}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .delta.up{background:var(--sage-soft);color:var(--sage-deep);}
  .delta.down{background:var(--crimson-soft);color:var(--crimson);}
  .delta.flat{background:var(--surface-2);color:var(--stone);}
  .delta-sub{font-size:10.5px;color:var(--mist);text-align:right;margin-top:4px;letter-spacing:.02em;}

  /* Bar chart */
  .plot{position:relative;}
  .grid-lines{position:absolute;inset:0 0 22px 0;pointer-events:none;}
  .grid-lines i{position:absolute;left:0;right:0;height:1px;background:var(--line-soft);}
  .bars{position:relative;display:flex;align-items:flex-end;gap:10px;height:172px;padding-top:20px;}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%;position:relative;cursor:default;}
  .bwrap{width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;}
  .bar{width:100%;max-width:22px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--sage),var(--sage-deep));
    min-height:4px;transition:height .5s var(--ease),filter .15s;position:relative;}
  .bar.best{background:linear-gradient(180deg,#F472B6,var(--burnt-hover));}
  .bcol:hover .bar{filter:brightness(1.08) saturate(1.1);}
  .bval{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--charcoal);white-space:nowrap;font-variant-numeric:tabular-nums;}
  .blbl{font-size:10.5px;color:var(--mist);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .bcol.best .blbl{color:var(--burnt);}

  /* Line chart */
  .linewrap{position:relative;}
  .line-svg{width:100%;height:158px;display:block;overflow:visible;}
  .line-x{display:flex;justify-content:space-between;margin-top:8px;}
  .line-x span{font-size:9.5px;color:var(--mist);font-weight:600;font-variant-numeric:tabular-nums;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .mini{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);}
  .mini-t{font-size:13px;color:var(--stone);font-weight:600;margin-bottom:14px;}
  .ring-wrap{display:flex;align-items:center;gap:16px;}
  .ring{width:88px;height:88px;position:relative;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);overflow:visible;}
  .ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-in .n{font-size:26px;line-height:1;color:var(--amber);}
  .ring-in .l{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--stone);font-weight:700;margin-top:2px;}
  .meter{height:12px;background:var(--sage-soft);border-radius:99px;overflow:hidden;margin-top:16px;}
  .meter > div{height:100%;background:linear-gradient(90deg,var(--sage),var(--sage-deep));border-radius:99px;transition:width .6s var(--ease);}

  .ins-t{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);font-weight:700;margin:8px 0 12px;}
  .ins-grid{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:14px;}
  .ins{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);}
  .ins .it{font-size:12px;color:var(--stone);font-weight:600;}
  .ins .iv{font-size:26px;line-height:1.05;margin-top:8px;color:var(--ink);}
  .ins .iv .u{font-size:13px;color:var(--stone);font-weight:500;letter-spacing:0;}
  .ins .is{font-size:11px;color:var(--mist);margin-top:5px;}
  .ins.star{background:linear-gradient(135deg,var(--amber-soft),#fff);border-color:#EBD9A8;}
  .ins.star .day{font-family:var(--font-brand);font-size:24px;font-weight:600;color:var(--ink);line-height:1.1;margin-top:6px;}
  /* Donut */
  .donut-row{display:flex;align-items:center;gap:14px;}
  .donut{width:92px;height:92px;flex-shrink:0;position:relative;}
  .donut svg{transform:rotate(-90deg);}
  .donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .donut-c .n{font-size:17px;color:var(--ink);}
  .donut-c .l{font-size:8.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--stone);font-weight:700;}
  .leg{display:flex;flex-direction:column;gap:6px;min-width:0;}
  .leg-item{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--charcoal);min-width:0;}
  .leg-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0;}
  .leg-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
  .leg-item .pc{font-weight:700;color:var(--stone);font-variant-numeric:tabular-nums;}

  /* tooltip */
  .tip{position:fixed;z-index:200;background:#241A38;color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;
    pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;transform:translate(-50%,-130%);box-shadow:0 6px 20px rgba(0,0,0,.3);}
  .tip.on{opacity:1;}
  .tip b{color:#F5B841;}

  .vacio{text-align:center;padding:50px 20px;color:var(--stone);}

  @media (max-width:920px){
    .app{grid-template-columns:1fr;}
    .sidebar{display:none;}
    main{padding:22px 16px 96px;}
    h1{font-size:32px;}
    .grid2{grid-template-columns:1fr;}
    .ins-grid{grid-template-columns:1fr;}
    .hero-row{flex-direction:row;align-items:center;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar"></aside>
  <main>
    <div class="hero-row">
      <div>
        <div class="greeting">Su progreso</div>
        <h1>Ver su <em>evolución</em></h1>
        <p class="hero-sub">Pequeños pasos, grandes cambios.</p>
      </div>
      <div class="streak-badge" id="streak-badge"><span class="fire">🔥</span> 0 días</div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-p="semana" onclick="setPeriodo('semana')">Semana</button>
      <button class="tab" data-p="mes" onclick="setPeriodo('mes')">Mes</button>
      <button class="tab" data-p="trim" onclick="setPeriodo('trim')">3 Meses</button>
    </div>

    <div id="contenido"><div class="vacio">Cargando tu evolución…</div></div>
  </main>
</div>
<div class="tip" id="tip"></div>

<script>
const DIAS_ISO={1:'Lun',2:'Mar',3:'Mié',4:'Jue',5:'Vie',6:'Sáb',7:'Dom'};
const DONUT_COLORS=['#E8590C','#16A34A','#7C3AED','#DB2777','#0891B2'];
let META={}, CATS=[], MET=[], periodo='semana';

function isoLocal(d){ const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function isoDow(fs){ const d=new Date(fs+'T12:00:00'); return d.getDay()===0?7:d.getDay(); }
function aplica(h,dow){ const dias=META[h.id]?.dias; if(!dias||!Array.isArray(dias)||!dias.length)return true; return dias.includes(dow); }
function esMio(h){ const yo=DD.personaId(); const m=META[h.id]||{}; return (m.alcance||'pareja')!=='personal'||m.persona_id===yo; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function cargar(){
  try{
    const t=await DD.token(); if(!t) return;
    await DD.cargarPersonas();
    const _pid=DD.personaId()||'';
    const [hd,met]=await Promise.all([DD.fetch('/habitos'),DD.fetch('/metricas/habitos?persona='+encodeURIComponent(_pid))]);
    CATS=hd.categorias||[]; META={}; (hd.habitos||[]).forEach(h=>META[h.id]=h);
    MET=met.habitos||[];
  }catch(e){ console.warn(e); document.getElementById('contenido').innerHTML='<div class="vacio">No se pudo cargar el progreso.</div>'; return; }
  render();
}

function porDia(nDias){
  const mine=MET.filter(h=>META[h.id]&&esMio(META[h.id]));
  const dias=[]; const hoy=new Date();
  for(let i=nDias-1;i>=0;i--){
    const d=new Date(hoy); d.setDate(hoy.getDate()-i); const fs=isoLocal(d); const dow=isoDow(fs);
    let done=0,total=0;
    mine.forEach(h=>{ if(!aplica(h,dow))return; const it=(h.ultimos_30_dias||[]).find(x=>x.fecha===fs); total++; if(it&&it.cumplido)done++; });
    dias.push({fecha:fs,dow,done,total,pct:total?Math.round(done/total*100):0});
  }
  return dias;
}
function porSemana(){
  const mine=MET.filter(h=>META[h.id]&&esMio(META[h.id]));
  if(!mine.length) return [];
  const n=Math.max(...mine.map(h=>(h.semanas||[]).length),0); const out=[];
  for(let w=0;w<n;w++){ let s=0,c=0,ini=null; mine.forEach(h=>{const x=(h.semanas||[])[w]; if(x){s+=x.pct;c++;ini=x.semana_inicio;}}); out.push({inicio:ini,pct:c?Math.round(s/c):0}); }
  return out;
}

/* SVG anillo */
function ringSVG(pct,size,sw,color,glow){
  const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-Math.max(0,Math.min(100,pct))/100);
  const f=glow?`filter="drop-shadow(0 0 5px ${glow})"`:'';
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" ${f}
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;
}

/* Línea con relleno + punto final */
function lineChart(vals,labels){
  if(vals.length<2) return '<div class="vacio" style="padding:24px">Aún no hay suficiente historia</div>';
  const W=100,H=100,pad=5;
  const pts=vals.map((v,i)=>[pad+(W-2*pad)*i/(vals.length-1), H-pad-(H-2*pad)*v/100]);
  const line=pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=`${pad},${H-pad} ${line} ${(W-pad)},${H-pad}`;
  const last=pts[pts.length-1];
  const xl=labels.map(l=>`<span>${l}</span>`).join('');
  return `<div class="linewrap">
    <svg class="line-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--sage)" stop-opacity=".18"/><stop offset="1" stop-color="var(--sage)" stop-opacity="0"/></linearGradient></defs>
      <line x1="5" y1="28" x2="95" y2="28" stroke="var(--line-soft)" stroke-width=".6"/>
      <line x1="5" y1="61" x2="95" y2="61" stroke="var(--line-soft)" stroke-width=".6"/>
      <polygon points="${area}" fill="url(#lg)"/>
      <polyline points="${line}" fill="none" stroke="var(--sage-deep)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
      <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="var(--sage-deep)" stroke="#fff" stroke-width="1.6" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="line-x">${xl}</div></div>`;
}

/* Donut categorías */
function donut(segments){
  const size=92,sw=15,r=(size-sw)/2,c=2*Math.PI*r;
  const tot=segments.reduce((s,x)=>s+x.v,0);
  if(!tot) return {svg:`<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/></svg>`, tot:0};
  let acc=0;
  const arcs=segments.map(s=>{
    const frac=s.v/tot, dash=frac*c, gap=c-dash, off=-acc*c;
    acc+=frac;
    return `<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}"
      stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>`;
  }).join('');
  return {svg:`<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="${sw}"/>${arcs}</svg>`, tot};
}

function setPeriodo(p){ periodo=p; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.p===p)); render(); }

function render(){
  const mine=MET.filter(h=>META[h.id]&&esMio(META[h.id]));
  const cont=document.getElementById('contenido');
  if(!mine.length){ cont.innerHTML='<div class="vacio">No hay hábitos para mostrar todavía.</div>'; document.getElementById('streak-badge').innerHTML='<span class="fire">🔥</span> 0 días'; return; }

  // ¿hay algún dato de cumplimiento? si no, estado vacío amable
  const totalMarcas = mine.reduce((s,h)=>s+(h.total_marcas||0),0);
  if(totalMarcas===0){
    document.getElementById('streak-badge').innerHTML='<span class="fire">🔥</span> 0 días';
    cont.innerHTML=`
      <div class="card" style="text-align:center;padding:48px 26px;">
        <div style="font-size:52px;line-height:1;margin-bottom:6px">📈</div>
        <h2 style="font-family:var(--font-brand);font-size:24px;font-weight:600;margin:0 0 8px">Tu evolución empieza hoy</h2>
        <p style="color:var(--stone);font-size:14px;max-width:44ch;margin:0 auto 22px;line-height:1.55">
          Aún no han marcado hábitos, por eso no hay nada que graficar todavía.
          Marca tus hábitos cada día y aquí verás las barras llenarse, la línea subir y tu racha crecer. 💪</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
          <a href="/tablero/habitos.html" style="background:var(--sage);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 20px;border-radius:12px;box-shadow:0 6px 16px -4px rgba(92,138,111,.5)">Ir a marcar hábitos</a>
          <a href="/" style="background:var(--surface);color:var(--charcoal);text-decoration:none;font-weight:600;font-size:14px;padding:11px 20px;border-radius:12px;border:1px solid var(--line)">Ver mi día</a>
        </div>
        <div style="margin-top:26px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;opacity:.75">
          <span style="font-size:12px;color:var(--mist)">Cuando haya datos verás:</span>
        </div>
        <div style="margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--stone)">
          <span style="background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 12px">📊 Cumplimiento diario</span>
          <span style="background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 12px">📈 Evolución 12 semanas</span>
          <span style="background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 12px">🔥 Racha</span>
          <span style="background:var(--surface-2);border:1px solid var(--line);border-radius:99px;padding:5px 12px">🍩 Por categoría</span>
        </div>
      </div>`;
    return;
  }

  // barras según periodo
  let bars=[],barLabels=[],barTitulo='',barUnidad='diario';
  if(periodo==='semana'){ const d=porDia(7); bars=d.map(x=>x.pct); barLabels=d.map(x=>DIAS_ISO[x.dow]); barTitulo='Cumplimiento diario · esta semana'; barUnidad='diario'; }
  else if(periodo==='mes'){ const d=porDia(28); const g=[]; for(let i=0;i<4;i++){const c=d.slice(i*7,i*7+7);const dn=c.reduce((s,x)=>s+x.done,0),tt=c.reduce((s,x)=>s+x.total,0);g.push(tt?Math.round(dn/tt*100):0);} bars=g; barLabels=['Sem 1','Sem 2','Sem 3','Actual']; barTitulo='Cumplimiento semanal · último mes'; barUnidad='semanal'; }
  else { const s=porSemana().slice(-12); bars=s.map(x=>x.pct); barLabels=s.map((x,i)=>(i%2===0&&x.inicio)?(new Date(x.inicio+'T12:00:00').getDate()+'/'+(new Date(x.inicio+'T12:00:00').getMonth()+1)):''); barTitulo='Cumplimiento semanal · 3 meses'; barUnidad='semanal'; }

  const prom=bars.length?Math.round(bars.reduce((a,b)=>a+b,0)/bars.length):0;
  const maxIdx=bars.indexOf(Math.max(...bars));
  const maxH=Math.max(1,...bars);
  const gridl=[0,.25,.5,.75].map(f=>`<i style="bottom:${(f*100)}%"></i>`).join('');
  const barsHtml=bars.map((v,i)=>`<div class="bcol ${i===maxIdx&&v>0?'best':''}" data-tip="${barLabels[i]||''}: ${v}%">
    <div class="bwrap"><div class="bar ${i===maxIdx&&v>0?'best':''}" style="height:${Math.max(4,Math.round(v/maxH*140))}px"><span class="bval">${v}%</span></div></div>
    <span class="blbl">${barLabels[i]||''}</span></div>`).join('');

  let delta=0;
  if(bars.length>=2){ const mid=Math.floor(bars.length/2); const rec=bars.slice(mid),prev=bars.slice(0,mid); const a=rec.reduce((x,y)=>x+y,0)/rec.length,b=prev.reduce((x,y)=>x+y,0)/(prev.length||1); delta=Math.round(a-b); }
  const dCls=delta>0?'up':delta<0?'down':'flat', dArr=delta>0?'▲':delta<0?'▼':'—';

  // línea evolución
  const sem=porSemana(); const lineVals=sem.map(x=>x.pct);
  const lineLbls=sem.filter((_,i)=>i%3===0||i===sem.length-1).map(x=>x.inicio?(new Date(x.inicio+'T12:00:00').getDate()+'/'+(new Date(x.inicio+'T12:00:00').getMonth()+1)):'');
  const ultSem=lineVals.length?lineVals[lineVals.length-1]:0;

  // racha + meta
  const rachaMax=Math.max(0,...mine.map(h=>h.racha_actual||0));
  const semHoy=porDia(7); const dW=semHoy.reduce((s,x)=>s+x.done,0),tW=semHoy.reduce((s,x)=>s+x.total,0); const metaSem=tW?Math.round(dW/tW*100):0;
  document.getElementById('streak-badge').innerHTML=`<span class="fire">🔥</span> ${rachaMax} ${rachaMax===1?'día':'días'}`;

  // insights
  const dias7=porDia(7).filter(x=>x.total>0);
  const mejorDia=dias7.length?dias7.reduce((a,b)=>b.pct>a.pct?b:a):null;
  const mejorHab=mine.slice().sort((a,b)=>(b.racha_actual||0)-(a.racha_actual||0))[0];

  // donut: cumplimientos últimos 7 días por categoría
  const hoyStr=isoLocal(new Date());
  const catCount={};
  mine.forEach(h=>{ const cid=META[h.id].categoria_id||'_'; const u=(h.ultimos_30_dias||[]).slice(-7); const n=u.filter(x=>x.cumplido).length; catCount[cid]=(catCount[cid]||0)+n; });
  const catList=(CATS.filter(c=>catCount[c.id]>0)).map((c,i)=>({nombre:c.nombre,v:catCount[c.id],color:DONUT_COLORS[i%DONUT_COLORS.length]}));
  const dnt=donut(catList);
  const legHtml=catList.length?catList.map(s=>`<div class="leg-item"><span class="leg-dot" style="background:${s.color}"></span><span class="nm">${esc(s.nombre)}</span><span class="pc">${Math.round(s.v/dnt.tot*100)}%</span></div>`).join(''):'<div style="color:var(--mist);font-size:12px">Sin datos aún</div>';

  cont.innerHTML=`
    <div class="card">
      <div class="card-head">
        <div><div class="card-t">${barTitulo}</div><div class="card-big num">${prom}<span class="u">% prom</span></div></div>
        <div style="text-align:right"><span class="delta ${dCls}">${dArr} ${Math.abs(delta)}%</span><div class="delta-sub">vs. periodo previo</div></div>
      </div>
      <div class="plot"><div class="grid-lines">${gridl}</div><div class="bars">${barsHtml}</div></div>
    </div>

    <div class="card">
      <div class="card-head"><div><div class="card-t">Tu evolución · cumplimiento semanal</div>
        <div class="card-big num">${ultSem}<span class="u">% última semana</span></div></div></div>
      ${lineChart(lineVals,lineLbls)}
    </div>

    <div class="grid2">
      <div class="mini">
        <div class="mini-t">Racha activa</div>
        <div class="ring-wrap">
          <div class="ring">${ringSVG(Math.min(100,rachaMax/30*100),88,9,'var(--amber-glow)','rgba(245,184,65,.55)')}
            <div class="ring-in"><span class="n num">${rachaMax}</span><span class="l">días</span></div></div>
          <div><div style="font-weight:700;font-size:15px">${rachaMax>0?'¡Sigue así! 🔥':'Empieza hoy'}</div>
            <div style="color:var(--stone);font-size:13px">Tu mejor cadena viva</div></div>
        </div>
      </div>
      <div class="mini">
        <div class="mini-t">Meta de la semana</div>
        <div class="card-big num" style="color:var(--sage-deep)">${metaSem}<span class="u">% de tus hábitos</span></div>
        <div class="meter"><div style="width:${metaSem}%"></div></div>
        <div style="font-size:12.5px;color:${metaSem>=80?'var(--sage-deep)':'var(--stone)'};font-weight:600;margin-top:10px">
          ${metaSem>=100?'¡Semana perfecta! 🎉':metaSem>=80?'¡Vas muy bien!':metaSem>=50?'Buen ritmo, sigue':'A darle con todo'}</div>
      </div>
    </div>

    <div class="ins-t">Insights</div>
    <div class="ins-grid">
      <div class="ins"><div class="it">Promedio ${barUnidad}</div><div class="iv num">${prom}<span class="u">%</span></div>
        <div class="is">${delta>=0?'▲':'▼'} ${Math.abs(delta)}% vs previo</div></div>
      <div class="ins"><div class="it">Cumplimiento por categoría</div>
        <div class="donut-row" style="margin-top:12px">
          <div class="donut">${dnt.svg}<div class="donut-c"><span class="n num">${dnt.tot}</span><span class="l">marcas</span></div></div>
          <div class="leg">${legHtml}</div>
        </div></div>
      <div class="ins star"><div class="it">Mejor día ⭐</div><div class="day">${mejorDia?DIAS_ISO[mejorDia.dow]:'—'}</div>
        <div class="is">${mejorDia?mejorDia.pct+'% cumplido':'sin datos'} · racha ${mejorHab?(mejorHab.racha_actual||0):0}🔥</div></div>
    </div>`;

  // tooltips de barras
  const tip=document.getElementById('tip');
  document.querySelectorAll('.bcol').forEach(col=>{
    col.addEventListener('mouseenter',e=>{ tip.innerHTML=col.dataset.tip.replace(/: (\d+%)/,': <b>$1</b>'); tip.classList.add('on'); });
    col.addEventListener('mousemove',e=>{ tip.style.left=e.clientX+'px'; tip.style.top=e.clientY+'px'; });
    col.addEventListener('mouseleave',()=>tip.classList.remove('on'));
  });
}

document.addEventListener('dd:persona',cargar);
document.addEventListener('DOMContentLoaded',cargar);
if(document.readyState!=='loading') cargar();
</script>
</body>
</html>

<style>
  :root{
    --paper:#FBFAF6;--paper-deep:#F5F2EA;--surface:#FFFFFF;--surface-2:#F8F6F0;
    --ink:#0E0D0B;--charcoal:#3A3733;--stone:#7A746B;--mist:#A8A29A;
    --line:#E8E4DA;--line-soft:#F0ECE2;--line-strong:#D5CFC2;
    --burnt:#EC4899;--burnt-hover:#DB2777;--burnt-soft:#FCE7F3;--burnt-line:#F9A8D4;
    --sage:#5C8A6F;--sage-soft:#E8F0EA;--sage-deep:#4A7259;--crimson:#A8392F;--crimson-soft:#F4E5E3;
    --amber:#B47B1E;--amber-soft:#F8EFDB;--indigo:#8B5CF6;--indigo-soft:#F3E8FF;
    --font-brand:"Fraunces","Times New Roman",serif;--font-body:"Inter",-apple-system,sans-serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--ink);background:var(--paper);
    background-image:radial-gradient(circle at 15% 10%,rgba(236,72,153,.03)0%,transparent 45%),radial-gradient(circle at 85% 90%,rgba(92,138,111,.04)0%,transparent 50%);}
  .app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;}
  .sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-gutter:stable;padding:24px 18px;border-right:1px solid #241A38;
    background:linear-gradient(180deg,#3B2D52 0%,#241A38 100%);display:flex;flex-direction:column;gap:22px;color:#E2E8F0;
    --sb-muted:#94A3B8;--sb-text:#E2E8F0;--sb-hover:rgba(255,255,255,.08);}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand-mark{font-family:var(--font-brand);font-style:italic;font-size:28px;line-height:1;letter-spacing:-.02em;color:#fff;}
  .brand-mark img{width:26px;height:26px;vertical-align:-6px;margin-right:8px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));}
  .brand-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);font-weight:500;}
  .nav-section{display:flex;flex-direction:column;gap:2px;}
  .nav-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);padding:0 10px 6px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--sb-text);font-size:13.5px;
    text-decoration:none;transition:background .15s;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left;width:100%;font-weight:500;position:relative;}
  .nav-item:hover{background:var(--sb-hover);color:#fff;}
  .nav-item.active{background:#fff;color:#241A38;font-weight:600;}
  .nav-item.active::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:#F472B6;border-radius:0 2px 2px 0;}
  .nav-icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  main{padding:34px 40px 100px;min-width:0;max-width:820px;width:100%;}
  .greeting{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--burnt);font-weight:700;}
  h1{font-family:var(--font-brand);font-weight:500;font-size:44px;line-height:1.04;letter-spacing:-.025em;margin:4px 0 4px;}
  h1 em{font-style:italic;color:var(--burnt);}
  .hero-sub{color:var(--stone);font-size:14px;margin:0 0 20px;}
  .hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .streak-badge{display:inline-flex;align-items:center;gap:7px;background:var(--amber-soft);border:1px solid var(--amber);color:var(--amber);
    padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap;}

  .tabs{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:20px;}
  .tab{border:none;background:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:700;color:var(--stone);
    padding:8px 18px;border-radius:999px;transition:all .13s;}
  .tab.active{background:var(--sage);color:#fff;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px;}
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .card-t{font-size:14px;color:var(--stone);font-weight:600;}
  .card-big{font-family:var(--font-brand);font-size:34px;font-weight:600;line-height:1;color:var(--ink);margin-top:4px;}
  .card-big small{font-size:15px;color:var(--stone);font-weight:400;}
  .delta{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .delta.up{background:var(--sage-soft);color:var(--sage-deep);}
  .delta.down{background:var(--crimson-soft);color:var(--crimson);}
  .delta-sub{font-size:11px;color:var(--mist);text-align:right;margin-top:3px;}

  /* bar chart */
  .bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px;position:relative;}
  .bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:7px;height:100%;}
  .bwrap{width:100%;flex:1;display:flex;align-items:flex-end;justify-content:center;}
  .bar{width:72%;max-width:34px;border-radius:7px 7px 4px 4px;background:linear-gradient(180deg,var(--sage),var(--sage-deep));min-height:4px;
    transition:height .5s var(--ease);position:relative;}
  .bar.best{background:linear-gradient(180deg,var(--burnt),var(--burnt-hover));}
  .bar-val{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;color:var(--stone);white-space:nowrap;}
  .blbl{font-size:10.5px;color:var(--mist);font-weight:600;}

  /* line chart */
  .linewrap{position:relative;}
  .line-svg{width:100%;height:150px;display:block;overflow:visible;}
  .line-x{display:flex;justify-content:space-between;margin-top:6px;}
  .line-x span{font-size:9.5px;color:var(--mist);font-weight:600;}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .mini{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px;}
  .mini-t{font-size:13px;color:var(--stone);font-weight:600;margin-bottom:10px;}
  .ring-wrap{display:flex;align-items:center;gap:14px;}
  .ring{width:76px;height:76px;position:relative;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-in .n{font-family:var(--font-brand);font-size:22px;font-weight:600;line-height:1;}
  .ring-in .l{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--stone);font-weight:600;}
  .goalbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:14px;}
  .goalbar > div{height:100%;background:linear-gradient(90deg,var(--sage),var(--sage-deep));border-radius:99px;transition:width .5s var(--ease);}

  .ins-t{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);font-weight:700;margin:6px 0 12px;}
  .ins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .ins{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 16px;}
  .ins .it{font-size:12px;color:var(--stone);font-weight:600;}
  .ins .iv{font-family:var(--font-brand);font-size:24px;font-weight:600;line-height:1.05;margin-top:6px;color:var(--ink);}
  .ins .iv small{font-size:13px;color:var(--stone);font-weight:400;}
  .ins .is{font-size:11px;color:var(--mist);margin-top:4px;}
  .ins.star{background:var(--amber-soft);border-color:var(--amber);}

  .vacio{text-align:center;padding:50px 20px;color:var(--stone);}

  @media (max-width:920px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;padding:18px 20px;}
    .nav-section{flex-direction:row;flex-wrap:wrap;}.nav-item{width:auto;}.nav-item.active::before{display:none;}.nav-label{display:none;}
    main{padding:24px 18px 100px;}
    h1{font-size:34px;}
    .grid2{grid-template-columns:1fr;}
    .ins-grid{grid-template-columns:1fr;}
  }
</style>

  <main>
    <div class="hero-row">
      <div>
        <div class="greeting">Su progreso</div>

<script>
const DIAS_ISO={1:'Lun',2:'Mar',3:'Mié',4:'Jue',5:'Vie',6:'Sáb',7:'Dom'};
let META={}, CATS=[], MET=[], TOT={}, periodo='semana';

function isoLocal(d){ const x=new Date(d); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); }
function isoDow(fs){ const d=new Date(fs+'T12:00:00'); return d.getDay()===0?7:d.getDay(); }
function aplica(h,dow){ const dias=META[h.id]?.dias; if(!dias||!Array.isArray(dias)||!dias.length)return true; return dias.includes(dow); }
function esMio(h){ const yo=DD.personaId(); const m=META[h.id]||{}; return (m.alcance||'pareja')!=='personal'||m.persona_id===yo; }
function esc(s){ return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function cargar(){
  try{
    const t=await DD.token(); if(!t) return;
    await DD.cargarPersonas();
    const [hd,met]=await Promise.all([DD.fetch('/habitos'),DD.fetch('/metricas/habitos')]);
    CATS=hd.categorias||[]; META={}; (hd.habitos||[]).forEach(h=>META[h.id]=h);
    MET=met.habitos||[]; TOT=met.totales||{};
  }catch(e){ console.warn(e); document.getElementById('contenido').innerHTML='<div class="vacio">No se pudo cargar el progreso.</div>'; return; }
  render();
}

/* agregado por día (últimos N días) usando aplicabilidad */
function porDia(nDias){
  const mine=MET.filter(h=>META[h.id]&&esMio(META[h.id]));
  // mapa fecha -> {done,total} desde ultimos_30_dias
  const dias=[];
  const hoy=new Date();
  for(let i=nDias-1;i>=0;i--){
    const d=new Date(hoy); d.setDate(hoy.getDate()-i); const fs=isoLocal(d); const dow=isoDow(fs);
    let done=0,total=0;
    mine.forEach(h=>{
      if(!aplica(h,dow))return;
      const item=(h.ultimos_30_dias||[]).find(x=>x.fecha===fs);
      total++; if(item&&item.cumplido)done++;
    });
    dias.push({fecha:fs,dow,done,total,pct:total?Math.round(done/total*100):0});
  }
  return dias;
}

/* agregado por semana (12 semanas) — promedio pct entre hábitos */
function porSemana(){
  const mine=MET.filter(h=>META[h.id]&&esMio(META[h.id]));
  if(!mine.length) return [];
  const n=Math.max(...mine.map(h=>(h.semanas||[]).length),0);
  const out=[];
  for(let w=0;w<n;w++){
    let sum=0,cnt=0,inicio=null;
    mine.forEach(h=>{ const s=(h.semanas||[])[w]; if(s){ sum+=s.pct; cnt++; inicio=s.semana_inicio; }});
    out.push({inicio,pct:cnt?Math.round(sum/cnt):0});
  }
  return out;
}

function ringSVG(pct,size,sw,color){
  const r=(size-sw)/2,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg width="${size}" height="${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>`;
}

function lineChart(vals, labels){
  if(!vals.length) return '<div class="vacio" style="padding:20px">Sin datos</div>';
  const W=100,H=100,pad=6;
  const max=100, min=0;
  const pts=vals.map((v,i)=>{
    const x=vals.length===1?W/2:pad+(W-2*pad)*i/(vals.length-1);
    const y=H-pad-(H-2*pad)*(v-min)/(max-min||1);
    return [x,y];
  });
  const poly=pts.map(p=>`${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ');
  const area=`${pad},${H-pad} `+poly+` ${(W-pad)},${H-pad}`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="1.6" fill="var(--sage-deep)"/>`).join('');
  const xl=labels.map(l=>`<span>${l}</span>`).join('');
  return `<div class="linewrap">
    <svg class="line-svg" viewBox="0 0 100 100" preserveAspectRatio="none">
      <line x1="6" y1="28" x2="94" y2="28" stroke="var(--line-soft)" stroke-width=".5" stroke-dasharray="2 2"/>
      <line x1="6" y1="61" x2="94" y2="61" stroke="var(--line-soft)" stroke-width=".5" stroke-dasharray="2 2"/>
      <polygon points="${area}" fill="var(--sage)" opacity=".10"/>
      <polyline points="${poly}" fill="none" stroke="var(--sage-deep)" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}
    </svg>
    <div class="line-x">${xl}</div></div>`;
}

function setPeriodo(p){ periodo=p; document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.p===p)); render(); }

function render(){
  const mine=MET.filter(h=>META[h.id]&&esMio(META[h.id]));
  const cont=document.getElementById('contenido');
  if(!mine.length){ cont.innerHTML='<div class="vacio">No hay hábitos para mostrar todavía.</div>'; document.getElementById('streak-badge').textContent='🔥 0 días'; return; }

  // ─── datos barras según periodo ───
  let bars=[], barLabels=[], barValFmt=v=>v+'%', barTitulo='';
  if(periodo==='semana'){
    const d=porDia(7); bars=d.map(x=>x.pct); barLabels=d.map(x=>DIAS_ISO[x.dow][0]);
    barTitulo='Cumplimiento diario · esta semana';
  }else if(periodo==='mes'){
    // agrupar últimos 28 días en 4 semanas
    const d=porDia(28); const grp=[];
    for(let i=0;i<4;i++){ const chunk=d.slice(i*7,i*7+7); const done=chunk.reduce((s,x)=>s+x.done,0),tot=chunk.reduce((s,x)=>s+x.total,0);
      grp.push(tot?Math.round(done/tot*100):0); }
    bars=grp; barLabels=['S-3','S-2','S-1','Actual']; barTitulo='Cumplimiento semanal · último mes';
  }else{
    const s=porSemana().slice(-12); bars=s.map(x=>x.pct);
    barLabels=s.map((x,i)=> (i%2===0 && x.inicio)? new Date(x.inicio+'T12:00:00').getDate()+'/'+(new Date(x.inicio+'T12:00:00').getMonth()+1) : '');
    barTitulo='Cumplimiento semanal · 3 meses';
  }
  const prom=bars.length?Math.round(bars.reduce((a,b)=>a+b,0)/bars.length):0;
  const maxIdx=bars.indexOf(Math.max(...bars));
  const maxH=Math.max(1,...bars);
  const barsHtml=bars.map((v,i)=>`<div class="bcol">
    <div class="bwrap"><div class="bar ${i===maxIdx&&v>0?'best':''}" style="height:${Math.max(4,Math.round(v/maxH*130))}px">
      <span class="bar-val">${v}%</span></div></div>
    <span class="blbl">${barLabels[i]||''}</span></div>`).join('');

  // delta vs periodo anterior (comparar prom mitad reciente vs previa)
  let delta=0;
  if(bars.length>=2){ const mid=Math.floor(bars.length/2); const rec=bars.slice(mid),prev=bars.slice(0,mid);
    const a=rec.reduce((x,y)=>x+y,0)/rec.length, b=prev.reduce((x,y)=>x+y,0)/(prev.length||1); delta=Math.round(a-b); }

  // ─── evolución (línea 12 semanas) ───
  const sem=porSemana();
  const lineVals=sem.map(x=>x.pct);
  const lineLbls=sem.filter((_,i)=>i%3===0||i===sem.length-1).map(x=>x.inicio?new Date(x.inicio+'T12:00:00').getDate()+'/'+(new Date(x.inicio+'T12:00:00').getMonth()+1):'');

  // ─── racha, meta semana ───
  const rachaMax=Math.max(0,...mine.map(h=>h.racha_actual||0));
  const semHoy=porDia(7); const doneW=semHoy.reduce((s,x)=>s+x.done,0),totW=semHoy.reduce((s,x)=>s+x.total,0);
  const metaSem=totW?Math.round(doneW/totW*100):0;
  document.getElementById('streak-badge').textContent=`🔥 ${rachaMax} ${rachaMax===1?'día':'días'}`;

  // ─── insights ───
  const dias7=porDia(7).filter(x=>x.total>0);
  const mejorDia=dias7.length?dias7.reduce((a,b)=>b.pct>a.pct?b:a):null;
  const mejorHab=mine.slice().sort((a,b)=>(b.racha_actual||0)-(a.racha_actual||0))[0];
  const mejorHabNombre=mejorHab?(META[mejorHab.id]?.nombre||''):'—';

  cont.innerHTML=`
    <div class="card">
      <div class="card-head">
        <div><div class="card-t">${barTitulo}</div><div class="card-big">${prom}<small>% prom</small></div></div>
        <div style="text-align:right">
          <span class="delta ${delta>=0?'up':'down'}">${delta>=0?'▲':'▼'} ${Math.abs(delta)}%</span>
          <div class="delta-sub">vs. periodo previo</div>
        </div>
      </div>
      <div class="bars">${barsHtml}</div>
    </div>

    <div class="card">
      <div class="card-head"><div><div class="card-t">Tu evolución · cumplimiento semanal</div>
        <div class="card-big">${lineVals.length?lineVals[lineVals.length-1]:0}<small>% última semana</small></div></div></div>
      ${lineChart(lineVals,lineLbls)}
    </div>

    <div class="grid2">
      <div class="mini">
        <div class="mini-t">Racha activa</div>
        <div class="ring-wrap">
          <div class="ring">${ringSVG(Math.min(100,rachaMax/30*100),76,8,'var(--amber)')}
            <div class="ring-in"><span class="n" style="color:var(--amber)">${rachaMax}</span><span class="l">días</span></div></div>
          <div><div style="font-weight:700;font-size:15px">${rachaMax>0?'¡Sigue así! 🔥':'Empieza hoy'}</div>
            <div style="color:var(--stone);font-size:13px">Tu mejor cadena viva</div></div>
        </div>
      </div>
      <div class="mini">
        <div class="mini-t">Meta de la semana</div>
        <div class="card-big" style="color:var(--sage-deep)">${metaSem}<small>% de tus hábitos</small></div>
        <div class="goalbar"><div style="width:${metaSem}%"></div></div>
        <div style="font-size:12px;color:${metaSem>=80?'var(--sage-deep)':'var(--stone)'};font-weight:600;margin-top:8px">
          ${metaSem>=100?'¡Semana perfecta! 🎉':metaSem>=80?'¡Vas muy bien!':metaSem>=50?'Buen ritmo, sigue':'A darle con todo'}</div>
      </div>
    </div>

    <div class="ins-t">Insights</div>
    <div class="ins-grid">
      <div class="ins"><div class="it">Promedio ${periodo==='semana'?'diario':'semanal'}</div>
        <div class="iv">${prom}<small>%</small></div><div class="is">${delta>=0?'▲ '+Math.abs(delta)+'% vs previo':'▼ '+Math.abs(delta)+'% vs previo'}</div></div>
      <div class="ins"><div class="it">Mejor día</div>
        <div class="iv">${mejorDia?DIAS_ISO[mejorDia.dow]:'—'}</div><div class="is">${mejorDia?mejorDia.pct+'% cumplido':'sin datos'}</div></div>
      <div class="ins star"><div class="it">Hábito estrella ⭐</div>
        <div class="iv" style="font-size:17px;line-height:1.15">${esc(mejorHabNombre)}</div>
        <div class="is">${mejorHab?('🔥 '+(mejorHab.racha_actual||0)+' días'):''}</div></div>
    </div>`;
}

document.addEventListener('dd:persona',render);
document.addEventListener('DOMContentLoaded',cargar);
if(document.readyState!=='loading') cargar();
</script>
</body>
</html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<script>(function(){try{var u=new URL(location.href);var k=u.searchParams.get("k");if(k){localStorage.setItem("organizador_token",k);u.searchParams.delete("k");history.replaceState({},"",u.pathname+u.search+u.hash);}}catch(e){}})();</script>
<title>LoveSprint — Al mercado</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<script src="/tablero/dd.js" defer></script>
<style>
  :root{
    --paper:#FBFAF6;--paper-deep:#F5F2EA;--surface:#FFFFFF;--surface-2:#F8F6F0;
    --ink:#0E0D0B;--charcoal:#3A3733;--stone:#7A746B;--mist:#A8A29A;
    --line:#E8E4DA;--line-soft:#F0ECE2;--line-strong:#D5CFC2;
    --burnt:#EC4899;--burnt-hover:#DB2777;--burnt-soft:#FCE7F3;--burnt-line:#F9A8D4;
    --sage:#5C8A6F;--sage-soft:#E8F0EA;--crimson:#A8392F;--crimson-soft:#F4E5E3;
    --amber:#B47B1E;--amber-soft:#F8EFDB;--indigo:#8B5CF6;--indigo-soft:#F3E8FF;
    --font-brand:"Fraunces","Times New Roman",serif;--font-body:"Inter",-apple-system,sans-serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--ink);background:var(--paper);
    background-image:radial-gradient(circle at 15% 10%,rgba(236,72,153,.03)0%,transparent 45%),radial-gradient(circle at 85% 90%,rgba(155,93,229,.03)0%,transparent 50%);}
  .app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;}
  .sidebar{position:sticky;top:0;height:100vh;padding:24px 18px;border-right:1px solid #241A38;
    background:linear-gradient(180deg,#3B2D52 0%,#241A38 100%);display:flex;flex-direction:column;gap:22px;color:#E2E8F0;
    --sb-muted:#94A3B8;--sb-text:#E2E8F0;--sb-hover:rgba(255,255,255,.08);}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand-mark{font-family:var(--font-brand);font-style:italic;font-size:28px;line-height:1;letter-spacing:-.02em;color:#fff;}
  .brand-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);font-weight:500;}
  .nav-section{display:flex;flex-direction:column;gap:2px;}
  .nav-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);padding:0 10px 6px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--sb-text);font-size:13.5px;
    text-decoration:none;transition:background .15s;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left;width:100%;font-weight:500;position:relative;}
  .nav-item:hover{background:var(--sb-hover);color:#fff;}
  .nav-item.active{background:#fff;color:#241A38;font-weight:600;}
  .nav-item.active::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:#F472B6;border-radius:0 2px 2px 0;}
  .nav-icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  main{padding:34px 34px 120px;min-width:0;max-width:640px;}
  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
  .greeting{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);font-weight:600;}
  h1{font-family:var(--font-brand);font-weight:500;font-size:44px;line-height:1.04;letter-spacing:-.025em;margin:4px 0 6px;}
  h1 em{font-style:italic;color:var(--burnt);}

  /* progreso grande */
  .prog-card{background:linear-gradient(135deg,#FCE7F3,#F3E8FF);border:1px solid #F9A8D4;border-radius:18px;
    padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;gap:16px;}
  .prog-num{font-family:var(--font-brand);font-size:40px;font-weight:500;line-height:1;color:var(--burnt);font-variant-numeric:tabular-nums;}
  .prog-num small{font-size:15px;color:var(--stone);font-family:var(--font-body);font-weight:600;}
  .prog-txt{flex:1;min-width:0;}
  .prog-txt .grande{font-size:15px;font-weight:700;color:var(--charcoal);}
  .prog-txt .chico{font-size:12.5px;color:var(--stone);}
  .prog-bar{height:8px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden;margin-top:8px;}
  .prog-bar span{display:block;height:100%;background:linear-gradient(90deg,var(--burnt),var(--indigo));border-radius:99px;transition:width .35s var(--ease);}

  /* agregar rápido */
  .quick{display:flex;gap:8px;margin-bottom:18px;}
  .quick input{flex:1;font-family:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:13px;padding:14px 16px;background:var(--surface);}
  .quick input:focus{outline:none;border-color:var(--burnt-line);box-shadow:0 0 0 3px var(--burnt-soft);}
  .quick button{border:none;border-radius:13px;padding:0 20px;font-family:inherit;font-size:15px;font-weight:700;color:#fff;
    background:linear-gradient(135deg,var(--burnt),var(--indigo));cursor:pointer;flex-shrink:0;}

  .grupo-tit{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--stone);margin:20px 2px 10px;display:flex;align-items:center;gap:8px;}
  .grupo-tit .cuenta{color:var(--mist);font-weight:600;letter-spacing:0;}

  /* filas grandes para el pulgar */
  .items{display:flex;flex-direction:column;gap:9px;}
  .it{display:flex;align-items:center;gap:14px;padding:16px 16px;background:var(--surface);border:1.5px solid var(--line);
    border-radius:15px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .08s,border-color .15s,background .15s;min-height:64px;}
  .it:active{transform:scale(.985);}
  .it .marca{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--line-strong);flex-shrink:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:16px;transition:all .15s;}
  .it .cuerpo{flex:1;min-width:0;}
  .it .nom{font-size:17px;font-weight:600;color:var(--ink);}
  .it .sub{font-size:13px;color:var(--stone);}
  .it .quitar{background:none;border:none;color:var(--mist);font-size:17px;cursor:pointer;padding:8px 10px;border-radius:9px;flex-shrink:0;}
  .it .quitar:hover{color:var(--crimson);background:var(--crimson-soft);}
  .it.ok{background:var(--sage-soft);border-color:transparent;}
  .it.ok .marca{background:var(--sage);border-color:var(--sage);}
  .it.ok .nom{text-decoration:line-through;color:var(--stone);font-weight:500;}
  .origen-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .origen-dot.menu{background:var(--burnt);}
  .origen-dot.despensa{background:var(--amber);}
  .origen-dot.manual{background:var(--mist);}

  .vacio{text-align:center;padding:48px 20px;color:var(--mist);}
  .vacio .emoji{font-size:44px;display:block;margin-bottom:10px;}
  .vacio a{color:var(--burnt);font-weight:600;text-decoration:none;}

  .barra-final{position:fixed;left:264px;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);
    backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 34px;display:flex;gap:10px;align-items:center;z-index:50;}
  .barra-final .msg{flex:1;font-size:13px;color:var(--stone);}
  .barra-final .msg b{color:var(--charcoal);}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:11px 16px;border-radius:11px;font-family:inherit;font-size:13.5px;font-weight:600;
    cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--charcoal);transition:all .15s;}
  .btn:hover{border-color:var(--line-strong);background:var(--surface-2);}
  .btn.peligro{color:var(--crimson);border-color:color-mix(in srgb,var(--crimson) 30%,transparent);background:var(--crimson-soft);}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#241A38;color:#fff;border-radius:12px;padding:11px 20px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:999;}
  .toast.visible{opacity:1;transform:translateX(-50%);}

  @media(max-width:920px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;padding:18px 20px;}
    .nav-section{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;}
    .nav-item{width:auto;}.nav-item.active::before{display:none;}.nav-label{display:none;}
    main{padding:22px 16px 110px;}h1{font-size:32px;}
    .barra-final{left:0;padding:12px 16px;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark"><img src="/tablero/lovesprint-mark.png" alt="LoveSprint" class="brand-logo" style="width:26px;height:26px;vertical-align:-6px;margin-right:8px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))">Love<em>Sprint</em></div><div class="brand-tag">juntos · organizados · avanzando</div></div>
    <div class="nav-section">
      <div class="nav-label">Tablero</div>
      <a href="/" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg><span>Hoy</span></a>
      <a href="/tablero/nosotros.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 22l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg><span>Nosotros</span></a>
      <a href="/tablero/sprint.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 22V4l13 4-13 4"/><path d="M4 13h9"/></svg><span>Sprint</span></a>
      <a href="/tablero/agenda.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Agenda</span></a>
      <a href="/tablero/proyectos.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="3" width="5" height="18" rx="1"/><rect x="10" y="3" width="5" height="12" rx="1"/><rect x="17" y="3" width="5" height="8" rx="1"/></svg><span>Proyectos</span></a>
      <div class="nav-label" style="margin-top:8px;">Casa</div>
      <a href="/tablero/comidas.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 3v7a3 3 0 0 0 3 3v8M7 3v7M10 3v7M17 3s-2 2-2 5 2 4 2 4v6"/></svg><span>Comidas</span></a>
      <a href="/tablero/mercado.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Mercado</span></a>
      <a href="/tablero/gastos.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span>Gastos</span></a>
      <div class="nav-label" style="margin-top:8px;">Configurar</div>
      <a href="/tablero/admin.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4"/></svg><span>Configuración</span></a>
    </div>
  </aside>

  <main>
    <div class="hero">
      <div>
        <div class="greeting">Modo mercado</div>
        <h1>Al <em>mercado</em></h1>
      </div>
    </div>

    <div class="prog-card" id="prog-card" style="display:none">
      <div class="prog-num" id="prog-num">0<small>/0</small></div>
      <div class="prog-txt">
        <div class="grande" id="prog-grande">Cargando…</div>
        <div class="chico" id="prog-chico"></div>
        <div class="prog-bar"><span id="prog-fill" style="width:0%"></span></div>
      </div>
    </div>

    <div class="quick">
      <input id="quick-item" placeholder="Agregar algo… (ej. Leche)" enterkeyhint="done" autocomplete="off"
        onkeydown="if(event.key==='Enter')agregar()">
      <button onclick="agregar()">＋</button>
    </div>

    <div id="listado"></div>
  </main>
</div>

<div class="barra-final" id="barra-final" style="display:none">
  <div class="msg" id="barra-msg"></div>
  <button class="btn peligro" id="btn-vaciar" onclick="vaciarComprados()">Vaciar comprados</button>
</div>

<div class="toast" id="toast"></div>

<script>
let items = [];

document.addEventListener('DOMContentLoaded', init);
async function init(){
  const t = await DD.token(); if(!t) return;
  await cargar();
}
async function cargar(){
  try{ items = (await DD.fetch('/lista-mercado')).lista_mercado || []; }
  catch(e){ toast('No se pudo cargar: '+e.message); items=[]; }
  pintar();
}

function pintar(){
  const cont = document.getElementById('listado');
  const total = items.length;
  const comprados = items.filter(i=>i.comprado).length;
  const pend = total - comprados;

  // tarjeta de progreso
  const card = document.getElementById('prog-card');
  if(total){
    card.style.display='flex';
    document.getElementById('prog-num').innerHTML = `${comprados}<small>/${total}</small>`;
    const pct = total ? Math.round(comprados/total*100) : 0;
    document.getElementById('prog-fill').style.width = pct+'%';
    document.getElementById('prog-grande').textContent = pend===0
      ? '¡Todo listo! 🎉' : (pend===1 ? 'Falta 1 cosa' : `Faltan ${pend} cosas`);
    document.getElementById('prog-chico').textContent = pend===0
      ? 'Nada pendiente en la lista.' : `${comprados} ya en el carrito · ${pct}% completo`;
  } else { card.style.display='none'; }

  if(!total){
    cont.innerHTML = `<div class="vacio"><span class="emoji">🛒</span>La lista está vacía.<br>
      Agrega algo arriba, o ármala desde el <a href="/tablero/comidas.html">menú de la semana</a>.</div>`;
    document.getElementById('barra-final').style.display='none';
    return;
  }

  const pendientes = items.filter(i=>!i.comprado).sort(porItem);
  const hechos = items.filter(i=>i.comprado).sort(porItem);

  let html = '';
  if(pendientes.length){
    html += `<div class="grupo-tit">Por comprar <span class="cuenta">${pendientes.length}</span></div>`;
    html += '<div class="items">' + pendientes.map(fila).join('') + '</div>';
  }
  if(hechos.length){
    html += `<div class="grupo-tit">En el carrito <span class="cuenta">${hechos.length}</span></div>`;
    html += '<div class="items">' + hechos.map(fila).join('') + '</div>';
  }
  cont.innerHTML = html;

  // barra final
  const barra = document.getElementById('barra-final');
  barra.style.display='flex';
  document.getElementById('barra-msg').innerHTML = pend===0
    ? '<b>¡Compra completa!</b> Puedes vaciar lo comprado.'
    : `<b>${pend}</b> por comprar · ${comprados} listo(s)`;
  document.getElementById('btn-vaciar').style.display = comprados ? '' : 'none';
}

function porItem(a,b){ return String(a.item).localeCompare(String(b.item),'es'); }

function fila(m){
  const sub = m.cantidad ? `${esc(m.cantidad)} ${esc(m.unidad||'')}`.trim() : '';
  const org = m.origen || 'manual';
  return `<div class="it ${m.comprado?'ok':''}" onclick="toggle('${m.id}',event)">
    <div class="marca">${m.comprado?'✓':''}</div>
    <div class="cuerpo">
      <div class="nom">${esc(m.item)}</div>
      ${sub?`<div class="sub"><span class="origen-dot ${org}"></span> ${sub}</div>`:`<div class="sub"><span class="origen-dot ${org}"></span> ${org==='menu'?'del menú':org==='despensa'?'despensa':'a mano'}</div>`}
    </div>
    <button class="quitar" onclick="borrar('${m.id}',event)" aria-label="Quitar">✕</button>
  </div>`;
}

async function toggle(id,ev){
  if(ev) ev.stopPropagation();
  const it = items.find(m=>m.id===id); if(!it) return;
  it.comprado = !it.comprado;
  pintar();
  if(it.comprado && navigator.vibrate) navigator.vibrate(12);
  try{ await DD.fetch('/lista-mercado/'+id,{method:'PUT',body:JSON.stringify({comprado:it.comprado})}); }
  catch(e){ it.comprado=!it.comprado; pintar(); toast('No se pudo guardar'); }
}

async function agregar(){
  const inp = document.getElementById('quick-item');
  const item = inp.value.trim(); if(!item) return;
  inp.value=''; inp.focus();
  try{
    const nuevo = await DD.fetch('/lista-mercado',{method:'POST',body:JSON.stringify({item,cantidad:'',origen:'manual'})});
    items.push(nuevo); pintar();
  }catch(e){ toast('No se pudo agregar'); }
}

async function borrar(id,ev){
  if(ev) ev.stopPropagation();
  const prev = items;
  items = items.filter(m=>m.id!==id); pintar();
  try{ await DD.fetch('/lista-mercado/'+id,{method:'DELETE'}); }
  catch(e){ items=prev; pintar(); toast('No se pudo quitar'); }
}

async function vaciarComprados(){
  const comprados = items.filter(i=>i.comprado);
  if(!comprados.length) return;
  if(!confirm(`¿Quitar ${comprados.length} cosa(s) ya compradas de la lista?`)) return;
  const prev = items;
  items = items.filter(i=>!i.comprado); pintar();
  try{ await Promise.all(comprados.map(c=>DD.fetch('/lista-mercado/'+c.id,{method:'DELETE'}))); toast('Carrito vaciado ✓'); }
  catch(e){ items=prev; pintar(); toast('No se pudieron quitar todas'); }
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('visible');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('visible'),2600);}
</script>
</body>
</html>

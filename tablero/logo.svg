<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="LoveSprint">
  <defs>
    <linearGradient id="ls-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0559B"/>
      <stop offset="55%" stop-color="#D45CB4"/>
      <stop offset="100%" stop-color="#9B5DE5"/>

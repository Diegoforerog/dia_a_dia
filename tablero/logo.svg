  </defs>
  <!-- corazón de dos personas -->
  <path d="M60,103 C24,78 11,58 11,38 C11,22 23,12 37,12 C48,12 55,19 60,29 C65,19 72,12 83,12 C97,12 109,22 109,38 C109,58 96,78 60,103 Z"

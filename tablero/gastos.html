<title>LoveSprint — Gastos</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<script src="/tablero/dd.js" defer></script>
<style>
  :root{
    --paper:#FBFAF6;--paper-deep:#F5F2EA;--surface:#FFFFFF;--surface-2:#F8F6F0;
    --ink:#0E0D0B;--charcoal:#3A3733;--stone:#7A746B;--mist:#A8A29A;
    --line:#E8E4DA;--line-soft:#F0ECE2;--line-strong:#D5CFC2;
    --burnt:#EC4899;--burnt-hover:#DB2777;--burnt-soft:#FCE7F3;--burnt-line:#F9A8D4;
    --sage:#5C8A6F;--sage-soft:#E8F0EA;--crimson:#A8392F;--crimson-soft:#F4E5E3;
    --amber:#B47B1E;--amber-soft:#F8EFDB;--indigo:#8B5CF6;--indigo-soft:#F3E8FF;
    --font-brand:"Fraunces","Times New Roman",serif;--font-body:"Inter",-apple-system,sans-serif;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{margin:0;padding:0;}
  body{font-family:var(--font-body);font-size:14px;line-height:1.55;color:var(--ink);background:var(--paper);
    background-image:radial-gradient(circle at 15% 10%,rgba(236,72,153,.03)0%,transparent 45%),radial-gradient(circle at 85% 90%,rgba(155,93,229,.03)0%,transparent 50%);}
  .app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;}
  .sidebar{position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-gutter:stable;padding:24px 18px;border-right:1px solid #241A38;
    background:linear-gradient(180deg,#3B2D52 0%,#241A38 100%);display:flex;flex-direction:column;gap:22px;color:#E2E8F0;
    --sb-muted:#94A3B8;--sb-text:#E2E8F0;--sb-hover:rgba(255,255,255,.08);}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand-mark{font-family:var(--font-brand);font-style:italic;font-size:28px;line-height:1;letter-spacing:-.02em;color:#fff;}
  .brand-tag{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);font-weight:500;}
  .nav-section{display:flex;flex-direction:column;gap:2px;}
  .nav-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sb-muted);padding:0 10px 6px;font-weight:600;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--sb-text);font-size:13.5px;
    text-decoration:none;transition:background .15s;background:transparent;border:none;cursor:pointer;font-family:inherit;text-align:left;width:100%;font-weight:500;position:relative;}
  .nav-item:hover{background:var(--sb-hover);color:#fff;}
  .nav-item.active{background:#fff;color:#241A38;font-weight:600;}
  .nav-item.active::before{content:"";position:absolute;left:-18px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:#F472B6;border-radius:0 2px 2px 0;}
  .nav-icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  main{padding:34px 34px 80px;min-width:0;max-width:720px;}
  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
  .greeting{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone);font-weight:600;}
  h1{font-family:var(--font-brand);font-weight:500;font-size:44px;line-height:1.04;letter-spacing:-.025em;margin:4px 0 6px;}
  h1 em{font-style:italic;color:var(--burnt);}

  .sem-nav{display:flex;align-items:center;gap:12px;margin:6px 0 18px;}
  .sem-nav .titulo{font-family:var(--font-brand);font-size:19px;font-weight:500;text-transform:capitalize;}
  .sem-nav .spacer{flex:1;}
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;
    cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--charcoal);transition:all .15s;}
  .btn:hover{border-color:var(--line-strong);background:var(--surface-2);}
  .btn.primario{background:var(--burnt);border-color:var(--burnt);color:#fff;}
  .btn.foto{background:linear-gradient(135deg,#8B5CF6,#EC4899);border:none;color:#fff;}
  .btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:18px;}
  .card-eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--burnt);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}

  /* balance */
  .balance{background:linear-gradient(135deg,#FCE7F3,#F3E8FF);border:1px solid #F9A8D4;}
  .bal-frase{font-family:var(--font-brand);font-size:24px;font-weight:500;line-height:1.2;letter-spacing:-.01em;color:var(--ink);}
  .bal-frase b{color:var(--burnt);}
  .bal-frase.par{color:var(--sage);}
  .bal-sub{font-size:13px;color:var(--stone);margin-top:4px;}
  .bal-mes{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .bal-mes .m{flex:1;min-width:100px;background:rgba(255,255,255,.6);border-radius:13px;padding:11px 13px;}
  .bal-mes .m .et{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--stone);}
  .bal-mes .m .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;}
  .bal-mes .m .v.g{color:var(--crimson);} .bal-mes .m .v.i{color:var(--sage);}
  .bal-mes .m .v.n.pos{color:var(--sage);} .bal-mes .m .v.n.neg{color:var(--crimson);}
  .bal-personas{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .bal-p{flex:1;min-width:130px;background:rgba(255,255,255,.45);border-radius:13px;padding:10px 13px;}
  .bal-p .quien{display:flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;}
  .bal-p .av{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;}
  .bal-p .monto{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:3px;}

  /* form */
  .tipo-seg{display:flex;gap:8px;margin-bottom:14px;}
  .tipo-seg button{flex:1;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;
    color:var(--stone);padding:12px;border-radius:12px;transition:all .13s;}
  .tipo-seg button.on.gasto{background:var(--crimson-soft);border-color:var(--crimson);color:var(--crimson);}
  .tipo-seg button.on.ingreso{background:var(--sage-soft);border-color:var(--sage);color:var(--sage);}
  .form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .campo{display:flex;flex-direction:column;gap:5px;}
  .campo.grow{flex:1;min-width:180px;}
  .campo label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--stone);}
  .campo input,.campo select{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);color:var(--ink);}
  .campo input:focus,.campo select:focus{outline:none;border-color:var(--burnt-line);box-shadow:0 0 0 3px var(--burnt-soft);}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap;}
  .seg button{border:none;background:var(--surface);cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--stone);padding:10px 13px;border-right:1px solid var(--line);}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:#241A38;color:#fff;}
  .foto-estado{font-size:12.5px;color:var(--indigo);font-weight:600;margin-bottom:10px;display:none;}
  .foto-estado.show{display:block;}

  /* lista */
  .lista{display:flex;flex-direction:column;gap:8px;}
  .g{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;}
  .g.ingreso{border-left:3px solid var(--sage);}
  .g .cat{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--surface-2);flex-shrink:0;}
  .g .cuerpo{flex:1;min-width:0;}
  .g .desc{font-weight:600;font-size:14.5px;}
  .g .meta{font-size:12px;color:var(--stone);display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .g .pill{font-size:10.5px;padding:1px 8px;border-radius:999px;background:var(--indigo-soft);color:var(--indigo);font-weight:600;}
  .g .pill.pers{background:var(--amber-soft);color:var(--amber);}
  .g .monto{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap;}
  .g .monto.i{color:var(--sage);}
  .g .del{background:none;border:none;color:var(--mist);cursor:pointer;font-size:14px;padding:6px 8px;border-radius:8px;}
  .g .del:hover{color:var(--crimson);background:var(--crimson-soft);}
  .dia-tit{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--mist);margin:16px 2px 8px;}
  .vacio{text-align:center;padding:40px 20px;color:var(--mist);font-style:italic;}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:#241A38;color:#fff;border-radius:12px;padding:11px 20px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:999;max-width:90vw;text-align:center;}
  .toast.visible{opacity:1;transform:translateX(-50%);}

  @media(max-width:920px){
    .app{grid-template-columns:1fr;}
    .sidebar{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;padding:18px 20px;}
    .nav-section{flex-direction:row;flex-wrap:wrap;flex:1 1 100%;}
    .nav-item{width:auto;}.nav-item.active::before{display:none;}.nav-label{display:none;}
    main{padding:22px 16px 60px;}h1{font-size:32px;}
  }
</style>
</head>
<body>
<div class="app">

    <div class="nav-section">

      <a href="/tablero/agenda.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span>Agenda</span></a>

      <a href="/tablero/mercado.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><span>Mercado</span></a>
      <a href="/tablero/gastos.html" class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg><span>Gastos</span></a>
      <div class="nav-label" style="margin-top:8px;">Configurar</div>
      <a href="/tablero/admin.html" class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4"/></svg><span>Configuración</span></a>
    </div>
  </aside>

  <main>
    <div class="hero">
      <div>
        <div class="greeting">Cuentas claras, amor tranquilo</div>
        <h1>Sus <em>gastos</em></h1>
      </div>
    </div>

    <div class="sem-nav">
      <button class="btn" onclick="cambiarMes(-1)">←</button>
      <span class="titulo" id="mes-titulo">Mes</span>
      <button class="btn" onclick="cambiarMes(1)">→</button>
    </div>

    <div class="card balance" id="balance-card">
      <div class="bal-frase" id="bal-frase">Cargando…</div>
      <div class="bal-sub" id="bal-sub"></div>
      <div class="bal-mes" id="bal-mes"></div>
      <div class="bal-personas" id="bal-personas"></div>
    </div>

    <div class="card">
      <div class="card-eyebrow">
        <span id="form-tit">Registrar movimiento</span>
        <button class="btn foto" onclick="document.getElementById('f-foto').click()">
          <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          Leer factura
        </button>
        <input type="file" id="f-foto" accept="image/*" capture="environment" style="display:none" onchange="leerFactura(this)">
      </div>
      <div class="foto-estado" id="foto-estado"></div>

      <div class="tipo-seg" id="tipo-seg">
        <button class="on gasto" data-tipo="gasto" onclick="setTipo('gasto')">💸 Gasto</button>
        <button data-tipo="ingreso" onclick="setTipo('ingreso')">💰 Ingreso</button>
      </div>

      <div class="form-row">
        <div class="campo grow"><label id="lbl-desc">¿En qué?</label>
          <input id="f-desc" placeholder="ej. Mercado de la semana" onkeydown="if(event.key==='Enter')guardarGasto()"></div>
        <div class="campo"><label>Monto</label>
          <input id="f-monto" inputmode="numeric" placeholder="$0" oninput="fmtMonto(this)"></div>
      </div>
      <div class="form-row">
        <div class="campo"><label>Categoría</label>

<script>
const CATS_GASTO = [
  {id:'mercado',emoji:'🛒',nombre:'Mercado'},{id:'comida',emoji:'🍽️',nombre:'Comida fuera'},
  {id:'hogar',emoji:'🏠',nombre:'Hogar'},{id:'servicios',emoji:'💡',nombre:'Servicios'},
  {id:'transporte',emoji:'🚗',nombre:'Transporte'},{id:'salud',emoji:'💊',nombre:'Salud'},
  {id:'ocio',emoji:'🎉',nombre:'Ocio / planes'},{id:'otros',emoji:'✨',nombre:'Otros'},
];
const CATS_INGRESO = [
  {id:'salario',emoji:'💼',nombre:'Salario'},{id:'negocio',emoji:'📈',nombre:'Negocio'},
  {id:'extra',emoji:'✨',nombre:'Extra'},{id:'regalo',emoji:'🎁',nombre:'Regalo'},
  {id:'otros',emoji:'💰',nombre:'Otros'},
];
const catMap = {}; [...CATS_GASTO,...CATS_INGRESO].forEach(c=>{catMap[c.id]=catMap[c.id]||c;});
let personas=[], mesActual=null, gastos=[], pagoSel='', partSel='ambos', tipoSel='gasto';

const fmtCOP = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n||0);

document.addEventListener('DOMContentLoaded', init);
async function init(){
  const t = await DD.token(); if(!t) return;
  personas = ((await DD.fetch('/personas')).personas || []).filter(p=>p.activo!==false);
  mesActual = new Date().toISOString().slice(0,7);
  document.getElementById('f-fecha').value = new Date().toISOString().slice(0,10);
  pagoSel = DD.personaId() || (personas[0]||{}).id || '';
  setTipo('gasto');
  pintarSegmentos();
  await cargar();
}

function ini(p){ return (p.nombre||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function nombreCorto(p){ return (p.nombre||'').split(/\s+/)[0]; }

function setTipo(t){
  tipoSel = t;
  document.querySelectorAll('#tipo-seg button').forEach(b=>{
    const on = b.dataset.tipo===t;
    b.classList.toggle('on',on); b.classList.toggle('gasto',b.dataset.tipo==='gasto'); b.classList.toggle('ingreso',b.dataset.tipo==='ingreso');
  });
  const esG = t==='gasto';
  const cats = esG?CATS_GASTO:CATS_INGRESO;
  document.getElementById('f-cat').innerHTML = cats.map(c=>`<option value="${c.id}">${c.emoji} ${c.nombre}</option>`).join('');
  document.getElementById('lbl-desc').textContent = esG?'¿En qué?':'¿De qué?';
  document.getElementById('f-desc').placeholder = esG?'ej. Mercado de la semana':'ej. Salario de junio';
  document.getElementById('lbl-pago').textContent = esG?'¿Quién pagó?':'¿Quién recibió?';
  document.getElementById('row-part').style.display = esG?'':'none';
  document.getElementById('btn-guardar-txt').textContent = esG?'Guardar gasto':'Guardar ingreso';
  document.getElementById('form-tit').textContent = esG?'Registrar gasto':'Registrar ingreso';
}

function pintarSegmentos(){
  document.getElementById('f-pago').innerHTML = personas.map(p=>
    `<button class="${p.id===pagoSel?'on':''}" onclick="pagoSel='${p.id}';pintarSegmentos()">${esc(nombreCorto(p))}</button>`).join('');
  document.getElementById('f-part').innerHTML =
    `<button class="${partSel==='ambos'?'on':''}" onclick="partSel='ambos';pintarSegmentos()">👫 De los dos</button>` +
    personas.map(p=>`<button class="${partSel===p.id?'on':''}" onclick="partSel='${p.id}';pintarSegmentos()">Solo ${esc(nombreCorto(p))}</button>`).join('');
}

function fmtMonto(inp){ let v=inp.value.replace(/[^\d]/g,''); inp.value = v ? new Intl.NumberFormat('es-CO').format(+v) : ''; }
function leerMonto(){ return +document.getElementById('f-monto').value.replace(/[^\d]/g,'') || 0; }
function setMonto(n){ document.getElementById('f-monto').value = n ? new Intl.NumberFormat('es-CO').format(Math.round(n)) : ''; }

function cambiarMes(delta){
  const [y,m] = mesActual.split('-').map(Number);
  mesActual = new Date(y, m-1+delta, 1).toISOString().slice(0,7);
  cargar();
}

async function cargar(){
  const [y,m] = mesActual.split('-').map(Number);
  document.getElementById('mes-titulo').textContent =
    new Date(y,m-1,1).toLocaleDateString('es',{month:'long',year:'numeric'});
  try{
    gastos = (await DD.fetch('/gastos?mes='+mesActual)).gastos || [];
    pintarBalance(await DD.fetch('/gastos/resumen?mes='+mesActual));
  }catch(e){ toast('No se pudo cargar: '+e.message); gastos=[]; }
  pintarLista();
}

function pintarBalance(res){
  const frase = document.getElementById('bal-frase');
  const sub = document.getElementById('bal-sub');
  const nada = !res.cantidad && !res.cantidad_ingresos;
  if(nada){
    frase.className='bal-frase par'; frase.textContent='Sin movimientos este mes ✨';
    sub.textContent='Registra el primero abajo, o toma una foto de una factura.';
  } else if(res.quien_debe){
    frase.className='bal-frase';
    frase.innerHTML = `<b>${esc(res.quien_debe.de_nombre)}</b> le debe <b>${fmtCOP(res.quien_debe.monto)}</b> a ${esc(res.quien_debe.a_nombre)}`;
    sub.textContent='Para quedar a mano con los gastos compartidos del mes.';
  } else if(res.cantidad){
    frase.className='bal-frase par'; frase.textContent='¡Están a mano! 🤝';
    sub.textContent='Nadie le debe nada a nadie este mes.';
  } else {
    frase.className='bal-frase par'; frase.textContent='Solo ingresos este mes 💰';
    sub.textContent='Aún no han registrado gastos.';
  }

  const neto = res.balance_neto||0;
  document.getElementById('bal-mes').innerHTML = `
    <div class="m"><div class="et">Gastado</div><div class="v g">${fmtCOP(res.total_gastos)}</div></div>
    <div class="m"><div class="et">Ingresos</div><div class="v i">${fmtCOP(res.total_ingresos)}</div></div>
    <div class="m"><div class="et">Neto del mes</div><div class="v n ${neto>=0?'pos':'neg'}">${neto>=0?'+':''}${fmtCOP(neto)}</div></div>`;

  document.getElementById('bal-personas').innerHTML = (res.personas||[]).map(pp=>{
    const p = personas.find(x=>x.id===pp.id) || {color:'#EC4899'};
    return `<div class="bal-p">
      <div class="quien"><span class="av" style="background:${p.color}">${p.emoji||ini(p)}</span>${esc(pp.nombre)}</div>
      <div class="monto">${fmtCOP(pp.pagado)}</div>
      <div class="bal-sub" style="margin:0">puso en gastos${pp.recibido?` · recibió ${fmtCOP(pp.recibido)}`:''}</div>
    </div>`;
  }).join('');
}

function pintarLista(){
  const cont = document.getElementById('lista');
  if(!gastos.length){ cont.innerHTML='<div class="vacio">Sin movimientos en este mes. Registra el primero arriba ☝️</div>'; return; }
  const porDia = {};
  gastos.forEach(g=>{ const d=String(g.fecha||'').slice(0,10); (porDia[d]=porDia[d]||[]).push(g); });
  const dias = Object.keys(porDia).sort().reverse();
  cont.innerHTML = dias.map(d=>{
    const fecha = d ? new Date(d+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'short'}) : 'Sin fecha';
    return `<div class="dia-tit">${esc(fecha)}</div><div class="lista">` + porDia[d].map(fila).join('') + `</div>`;
  }).join('');
}

function fila(g){
  const esIng = (g.tipo==='ingreso');
  const cat = catMap[g.categoria] || (esIng?catMap.otros:{emoji:'✨'});
  const quien = personas.find(p=>p.id===g.pagado_por);
  let metaTxt;
  if(esIng){ metaTxt = quien?('Recibió '+esc(nombreCorto(quien))):'Ingreso'; }
  else {
    const esPers = g.participacion && g.participacion!=='ambos';
    const persDe = personas.find(p=>p.id===g.participacion);
    const pill = esPers ? `<span class="pill pers">solo ${esc(nombreCorto(persDe||{nombre:'?'}))}</span>` : `<span class="pill">👫 de los dos</span>`;
    metaTxt = `${quien?('Pagó '+esc(nombreCorto(quien))):'—'} ${pill}`;
  }
  return `<div class="g ${esIng?'ingreso':''}">
    <div class="cat">${esIng?'💰':cat.emoji}</div>
    <div class="cuerpo"><div class="desc">${esc(g.descripcion)}</div><div class="meta">${metaTxt}</div></div>
    <div class="monto ${esIng?'i':''}">${esIng?'+':''}${fmtCOP(g.monto)}</div>
    <button class="del" onclick="borrar('${g.id}')" aria-label="Eliminar">🗑</button>
  </div>`;
}

async function guardarGasto(){
  const descripcion = document.getElementById('f-desc').value.trim();
  const monto = leerMonto();
  if(!descripcion){ toast(tipoSel==='gasto'?'¿En qué fue el gasto?':'¿De qué es el ingreso?'); return; }
  if(!monto){ toast('Ponle un monto'); return; }
  const body = {
    descripcion, monto, tipo: tipoSel,
    categoria: document.getElementById('f-cat').value,
    fecha: document.getElementById('f-fecha').value || new Date().toISOString().slice(0,10),
    pagado_por: pagoSel,
    participacion: tipoSel==='gasto' ? partSel : 'ambos',
  };
  try{
    await DD.fetch('/gastos',{method:'POST',body:JSON.stringify(body)});
    document.getElementById('f-desc').value=''; document.getElementById('f-monto').value='';
    document.getElementById('f-desc').focus();
    toast(tipoSel==='gasto'?'Gasto guardado ✓':'Ingreso guardado ✓');
    if(body.fecha.slice(0,7)!==mesActual) mesActual=body.fecha.slice(0,7);
    await cargar();
  }catch(e){ toast('No se pudo: '+e.message); }
}

async function borrar(id){
  if(!confirm('¿Eliminar este movimiento?')) return;
  try{ await DD.fetch('/gastos/'+id,{method:'DELETE'}); await cargar(); toast('Eliminado'); }
  catch(e){ toast('No se pudo: '+e.message); }
}

/* ── Leer factura con la cámara / galería ── */
async function leerFactura(input){
  const file = input.files && input.files[0];
  input.value = '';
  if(!file) return;
  const est = document.getElementById('foto-estado');
  est.className='foto-estado show'; est.textContent='📷 Leyendo la factura…';
  try{
    const dataUrl = await comprimirImagen(file, 1400, 0.72);
    const r = await DD.fetch('/gastos/leer-factura',{method:'POST',body:JSON.stringify({imagen:dataUrl})});
    setTipo('gasto');
    if(r.descripcion) document.getElementById('f-desc').value = r.descripcion;
    if(r.monto) setMonto(r.monto);
    if(r.categoria){ const sel=document.getElementById('f-cat'); if([...sel.options].some(o=>o.value===r.categoria)) sel.value=r.categoria; }
    if(r.fecha && /^\d{4}-\d{2}-\d{2}$/.test(r.fecha)) document.getElementById('f-fecha').value = r.fecha;
    est.textContent = r.monto ? '✓ Listo — revisa los datos y guarda' : '⚠️ No pude leer el total, complétalo a mano';
    setTimeout(()=>est.classList.remove('show'), 4000);
  }catch(e){
    est.textContent = 'No se pudo leer: '+e.message;
    setTimeout(()=>est.classList.remove('show'), 4000);
  }
}

function comprimirImagen(file, maxDim, calidad){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let {width,height} = img;
      if(width>height && width>maxDim){ height=Math.round(height*maxDim/width); width=maxDim; }
      else if(height>maxDim){ width=Math.round(width*maxDim/height); height=maxDim; }
      const c=document.createElement('canvas'); c.width=width; c.height=height;
      c.getContext('2d').drawImage(img,0,0,width,height);
      resolve(c.toDataURL('image/jpeg',calidad));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error('imagen inválida')); };
    img.src = url;
  });
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let tt; function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('visible');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('visible'),2800);}
</script>

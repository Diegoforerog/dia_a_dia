<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>LoveSprint — Entrar</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#241A38">
<link rel="manifest" href="/tablero/manifest.webmanifest">
<link rel="apple-touch-icon" href="/tablero/iconos/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..600,0..100&family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF6; --surface:#FFFFFF; --ink:#0E0D0B; --stone:#7A746B; --mist:#A8A29A;
    --line:#E8E4DA; --line-strong:#D5CFC2; --love:#EC4899; --sprint:#9B5DE5;
    --font-brand:"Fraunces","Times New Roman",serif; --font-body:"Inter",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{margin:0;height:100%;}
  body{font-family:var(--font-body);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(150deg,#2E2140 0%,#3B2D52 55%,#5B3B6E 100%);}
  .caja{width:100%;max-width:400px;background:var(--paper);border-radius:22px;padding:34px 30px 28px;
    box-shadow:0 30px 80px rgba(15,10,25,.45);text-align:center;}
  .logo-full{width:230px;max-width:82%;margin:0 auto 22px;display:block;}
  h2{font-family:var(--font-brand);font-weight:500;font-size:22px;margin:0 0 4px;}
  .sub{font-size:13px;color:var(--stone);margin:0 0 22px;}
  form{text-align:left;}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--stone);margin:0 0 6px;}
  input[type=password],input[type=text]{width:100%;font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:11px;
    padding:12px 14px;background:var(--surface);color:var(--ink);margin-bottom:14px;}
  input:focus{outline:none;border-color:var(--love);box-shadow:0 0 0 3px rgba(236,72,153,.15);}
  .btn{width:100%;border:none;border-radius:12px;padding:13px;font-family:inherit;font-size:15px;font-weight:600;color:#fff;cursor:pointer;
    background:linear-gradient(135deg,var(--love),var(--sprint));box-shadow:0 6px 18px rgba(155,93,229,.3);}
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.6;cursor:default;}
  .msg{font-size:12.5px;margin-top:12px;min-height:16px;}
  .msg.err{color:#C0392B;} .msg.ok{color:#2E7D32;}
  .nota{font-size:11px;color:var(--mist);margin-top:6px;}
  @media (prefers-reduced-motion:reduce){.p-card{transition:none;}}
</style>
</head>
<body>
  <div class="caja">
    <img src="/tablero/lovesprint-logo.png" alt="LoveSprint" class="logo-full">

    <h2>Iniciar sesión</h2>
    <p class="sub">Entra con tu usuario y contraseña.</p>

    <form id="form-login" autocomplete="on">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" placeholder="Tu nombre" autocapitalize="words">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" id="btn-entrar" type="submit">Entrar</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>

<script>
const API_BASE = (location.hostname==='localhost'||location.hostname==='127.0.0.1') ? 'http://localhost:5050/api' : '/api';
const next = new URLSearchParams(location.search).get('next') || '/';
function msg(t, ok){ const m=document.getElementById('msg'); m.textContent=t; m.className='msg '+(ok?'ok':'err'); }

document.getElementById('form-login').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const usuario = document.getElementById('usuario').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btn-entrar');
  if(!usuario || !password){ msg('Escribe tu usuario y tu contraseña'); return; }
  btn.disabled=true; btn.textContent='Entrando…';
  try{
    const r = await fetch(API_BASE+'/auth/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({usuario, password})});
    const d = await r.json();
    if(!r.ok){ msg(d.error || 'No se pudo entrar'); btn.disabled=false; btn.textContent='Entrar'; return; }
    localStorage.setItem('organizador_token', d.token);
    localStorage.setItem('dd_persona_id', d.persona_id);
    msg('¡Bienvenido! 💗', true);
    location.href = next.startsWith('/') ? next : '/';
  }catch(err){ msg('Error de conexión'); btn.disabled=false; btn.textContent='Entrar'; }
});
document.getElementById('usuario').focus();
</script>
</body>
</html>
